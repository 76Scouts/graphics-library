name: Static snapshot (catalog + thumbnails)

# Every 30 min: copy the library index + thumbnails from the Apps Script backend
# into data/ so graphics.76.life can show everything instantly from GitHub Pages.
# Full files are NOT copied — downloads still go through Drive.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snapshot.yml"
      - "tools/snapshot.mjs"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build snapshot
        run: node tools/snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "76 snapshot bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "snapshot: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
